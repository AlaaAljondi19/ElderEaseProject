<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElderEase - لوحة الإدارة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/admin.css?v=1.5" />
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h3><i class="bi bi-heart-pulse-fill"></i> إيلدر إيز</h3>
            <small>لوحة تحكم المدير</small>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section">الرئيسية</div>
            <a href="#" class="sidebar-link active" onclick="showSection('dashboard',this)">
                <i class="bi bi-grid-fill"></i> لوحة التحكم
            </a>
            <a href="#" class="sidebar-link" onclick="showSection('requests',this)">
                <i class="bi bi-life-preserver"></i> طلبات المساعدة
                <span class="badge me-auto">12</span>
            </a>

            <div class="sidebar-section">إدارة المحتوى</div>
            <a href="#" class="sidebar-link" onclick="showSection('volunteers',this)">
                <i class="bi bi-people-fill"></i> المتطوعون
            </a>
            <a href="#" class="sidebar-link" onclick="showSection('users',this)">
                <i class="bi bi-person-circle"></i> المستخدمون
            </a>
            <a href="#" class="sidebar-link" onclick="showSection('organizations',this)">
                <i class="bi bi-hospital"></i> المؤسسات
            </a>
            <a href="#" class="sidebar-link" onclick="showSection('messages',this)">
                <i class="bi bi-envelope-fill"></i> الرسائل
                <span class="badge me-auto">5</span>
            </a>

            <div class="sidebar-section">الإعدادات</div>
            <a href="#" class="sidebar-link" onclick="showSection('settings',this)">
                <i class="bi bi-gear-fill"></i> إعدادات الموقع
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html">
                <i class="bi bi-house-fill"></i> العودة للموقع
            </a>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" onclick="toggleMenu()"><i class="bi bi-list"></i></button>
                <h4 id="pageTitle">لوحة التحكم</h4>
            </div>
            <div class="topbar-right">
                <i class="bi bi-bell fs-5" style="color:var(--muted);cursor:pointer;"></i>
                <div class="admin-avatar">م</div>
                <span class="d-none d-sm-inline" style="font-weight:600;font-size:.9rem;">المدير</span>
            </div>
        </div>

        <div class="page-area">
            <div class="section active" id="section-dashboard">
                <div class="row g-3 mb-4">
                    <div class="col-6 col-xl-3">
                        <div class="stat-card">
                            <div class="stat-icon orange"><i class="bi bi-people-fill"></i></div>
                            <div class="stat-info"><div class="num">247</div><div class="label">مستخدم</div></div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="stat-card">
                            <div class="stat-icon blue"><i class="bi bi-life-preserver"></i></div>
                            <div class="stat-info"><div class="num">84</div><div class="label">طلب</div></div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="stat-card">
                            <div class="stat-icon green"><i class="bi bi-person-check-fill"></i></div>
                            <div class="stat-info"><div class="num">32</div><div class="label">متطوع</div></div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="stat-card">
                            <div class="stat-icon purple"><i class="bi bi-envelope-fill"></i></div>
                            <div class="stat-info"><div class="num">18</div><div class="label">رسالة</div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section" id="section-requests">
                <h5 class="mb-3">طلبات المساعدة</h5>
                <div class="table-card">
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>#</th><th>الاسم</th><th>النوع</th><th>الهاتف</th><th>الحالة</th><th>إجراء</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/admin.js?v=1.5"></script>
</body>
</html>
