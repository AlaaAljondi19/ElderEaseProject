    <h2><i class="bi bi-bank" style="color:var(--primary)"></i> المؤسسات الداعمة</h2>

  <div class="search-row">
    <input type="text" id="orgSearch" class="search-input" placeholder="ابحث عن مؤسسة أو مدينة..." onkeyup="searchOrgs()">

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterOrg(this, 'all')">الكل</button>
    <button class="filter-tab" onclick="filterOrg(this, 'health')">مراكز صحية</button>

    <button class="filter-tab" onclick="filterOrg(this, 'retire')">دور رعاية</button>
  </div>

  <div class="row g-4" id="organizationsList">
      <div class="text-center py-5" id="loadingState">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">جاري جلب بيانات المؤسسات...</p>
      </div>
  </div>
