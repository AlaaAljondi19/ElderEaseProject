<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElderEase - لوحة الإدارة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/admin.css?v=1.6" />
    <style>
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1040; display: none; }
        .overlay.show { display: block; }
        .sidebar.open { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h3><i class="bi bi-heart-pulse-fill"></i> إيلدر إيز</h3>
            <small>لوحة تحكم المدير</small>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section">الرئيسية</div>
            <a href="#" class="sidebar-link active" onclick="showSection('dashboard', this, event)">
                <i class="bi bi-grid-fill"></i> لوحة التحكم
            </a>
            <a href="#" class="sidebar-link" onclick="showSection('requests', this, event)">
                <i class="bi bi-life-preserver"></i> طلبات المساعدة
                <span class="badge me-auto" id="reqCount">0</span>
            </a>
            <div class="sidebar-section">إدارة المحتوى</div>
            <a href="#" class="sidebar-link" onclick="showSection('volunteers', this, event)">
                <i class="bi bi-people-fill"></i> المتطوعون
            </a>
            <a href="#" class="sidebar-link" onclick="showSection('messages', this, event)">
                <i class="bi bi-envelope-fill"></i> الرسائل
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html"><i class="bi bi-house-fill"></i> العودة للموقع</a>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" onclick="toggleMenu()"><i class="bi bi-list"></i></button>
                <h4 id="pageTitle">لوحة التحكم</h4>
            </div>
            <div class="topbar-right">
                <div class="admin-avatar">A</div>
                <span class="d-none d-sm-inline" style="font-weight:600;">عليا بسام</span>
            </div>
        </div>

        <div class="page-area">
            <div class="section active" id="section-dashboard">
                <div class="row g-3">
                    <div class="col-6 col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon orange"><i class="bi bi-people"></i></div>
                            <div class="stat-info"><div class="num" id="totalStats">0</div><div class="label">إجمالي العمليات</div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section" id="section-requests">
                <div class="table-card">
                    <div class="card-head"><h6>طلبات المساعدة</h6></div>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>#</th><th>الاسم</th><th>النوع</th><th>الحالة</th><th>إجراء</th></tr></thead>
                            <tbody id="requestsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="section" id="section-volunteers">
                <div class="table-card">
                    <div class="card-head"><h6>إدارة المتطوعين</h6></div>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>الاسم</th><th>التخصص</th><th>الحالة</th><th>إجراء</th></tr></thead>
                            <tbody id="volunteersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="section" id="section-messages">
                <div class="table-card">
                    <div class="card-head"><h6>الرسائل الواردة</h6></div>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>#</th><th>المرسل</th><th>الموضوع</th><th>الرسالة</th><th>إجراء</th></tr></thead>
                            <tbody id="messagesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/admin.js?v=1.6"></script>
</body>
</html>
